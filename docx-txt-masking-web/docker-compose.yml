services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MASKING_MAX_UPLOAD_SIZE_MB: "20"
    volumes:
      - ./storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    depends_on:
      - api
